<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Longitude Time</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body id="app">
	<header class="container p-3">
		<h1>Longitude Time</h1>
	</header>

	<main class="container p-3">
		<section class="hstack gap-2">
			<label for="city">City: </label>
			<input class="form-control" type="text" v-model="city" id="city">
			<button class="btn btn-primary" type="button" @click="geolocate()">Submit</button>
		</section>

		<section class="mt-3">
			<ul>
				<li>Your longitude is {{ longitude }}</li>
				<li>Your offset is {{ offset }}</li>
			</ul>
		</section>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
	<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
	<script src="./index.js"></script>
</body>

</html>
